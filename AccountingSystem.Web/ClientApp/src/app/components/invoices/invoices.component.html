<div class="container mt-5">
  <h2>إدارة الفواتير</h2>
  
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  
  <div class="mb-3">
    <button class="btn btn-primary" routerLink="/invoices/new">
      فاتورة جديدة
    </button>
  </div>

  <div *ngIf="loading" class="spinner-border" role="status">
    <span class="visually-hidden">جاري التحميل...</span>
  </div>

  <table class="table table-striped" *ngIf="!loading">
    <thead>
      <tr>
        <th>رقم الفاتورة</th>
        <th>العميل</th>
        <th>التاريخ</th>
        <th>الإجمالي</th>
        <th>المدفوع</th>
        <th>الحالة</th>
        <th>الإجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let invoice of invoices">
        <td>{{ invoice.invoiceNumber }}</td>
        <td>{{ invoice.customerName }}</td>
        <td>{{ invoice.invoiceDate | date:'dd/MM/yyyy' }}</td>
        <td>{{ invoice.total | currency }}</td>
        <td>{{ invoice.paidAmount | currency }}</td>
        <td>
          <span class="badge" [ngClass]="{
            'bg-warning': invoice.status === 'Draft',
            'bg-info': invoice.status === 'Confirmed',
            'bg-success': invoice.status === 'FullyPaid'
          }">
            {{ invoice.status }}
          </span>
        </td>
        <td>
          <button class="btn btn-sm btn-info" [routerLink]="['/invoices', invoice.id]">
            عرض
          </button>
          <button class="btn btn-sm btn-success" (click)="confirmInvoice(invoice.id)" 
            [disabled]="invoice.status !== 'Draft'">
            تأكيد
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteInvoice(invoice.id)">
            حذف
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
