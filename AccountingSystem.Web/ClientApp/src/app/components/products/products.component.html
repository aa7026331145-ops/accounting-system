<div class="container mt-5">
  <h2>إدارة المنتجات</h2>
  
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  
  <div class="mb-3">
    <button class="btn btn-primary" routerLink="/products/new">
      منتج جديد
    </button>
  </div>

  <div *ngIf="loading" class="spinner-border" role="status">
    <span class="visually-hidden">جاري التحميل...</span>
  </div>

  <table class="table table-striped" *ngIf="!loading">
    <thead>
      <tr>
        <th>الكود</th>
        <th>الاسم</th>
        <th>الفئة</th>
        <th>السعر (شراء)</th>
        <th>السعر (بيع)</th>
        <th>الكمية</th>
        <th>الإجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.code }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.categoryName }}</td>
        <td>{{ product.buyingPrice | currency }}</td>
        <td>{{ product.sellingPrice | currency }}</td>
        <td>{{ product.quantity }}</td>
        <td>
          <button class="btn btn-sm btn-info" [routerLink]="['/products', product.id]">
            تعديل
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteProduct(product.id)">
            حذف
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
